                                <option value="0x00">Set the display to Processing mode</option>

                                <option value="0xF0">Request the current display type</option>
                            </optgroup>
                            <optgroup label="If the current source is FM:"></optgroup>

                                <option value="0x02">– Set the display to Programme type</option>
                                <option value="0x03">– Set the display to Signal strength</option>
                            <optgroup label="If the current source is DAB (AVR450/750 only):"></option>
                                <option value="0x01">Set the display to Radio text</option>
                                <option value="0x02">Set the display to Genre</option>
                                <option value="0x03">Set the display to Signal quality</option>
                                <option value="0x04">Set the display to Bit rate</option>
                            <optgroup label="If the current source is NET/USB"></option>
                                <option value="0x01">Set the display to Track</option> 
                                <option value="0x02">Set the display to Artist</option>
                                <option value="0x03">Set the display to Album</option> 
                                <option value="0x04">Set the display to audio type</option>
                                <option value="0x05">Set the display to rate</option>  
                            </optgroup>
                        </select>
                        <button class="btn btn-secondary" role="lexicom" data-command="0x00" data-hex-from="#lexicom-display-sources" >Display Information Type</button>
                    </div>
                    <button class="btn btn-secondary" role="lexicom" data-command="0x1D" data-hex="0xF0">Request current source</button>

                    <button class="btn btn-secondary" role="lexicom" data-command="0x1F" data-hex="0x01">Headphone Over-ride set</button>

    <!-- Bootstrap JS (optionnel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const output = document.getElementById('Lexicom-output');
            const zone = document.getElementById('Lexicom-zone');
            // const data = document.getElementById('Lexicom-data');

            document.querySelectorAll('button[role="lexicom-rc5"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const command1 = btn.getAttribute('data-command1');
                    const command2 = btn.getAttribute('data-command2');
                    fetch(`/lexicon_rc5?zone=${zone.value}&command1=${encodeURIComponent(command1)}&command2=${encodeURIComponent(command2)}`)
                        .then(response => response.text())
                        .then(data => {
                            output.textContent = `${data}`;
                        })
                        .catch(error => {
                            output.textContent = `Erreur: ${error}`;
                        });
                });
            });
            document.querySelectorAll('button[role="lexicom"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const command = btn.getAttribute('data-command');
                    fetch(`/lexicon_cmd?zone=${zone.value}&command=${encodeURIComponent(command)}&data=`)
                        .then(response => response.text())
                        .then(data => {
                            output.textContent = `${data}`;
                        })
                        .catch(error => {
                            output.textContent = `Erreur: ${error}`;
                        });
                });
            });
        });
    </script>

</body>
</html>
